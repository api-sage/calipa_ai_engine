# Local stack: Postgres, a one-off migration, the API and one worker.
#   docker compose -f ops/docker-compose.yml up --build
# Secrets come from ../.env (git-ignored). The anchors volume is an ordinary volume,
# fine for development; production needs storage that cannot be overwritten or
# deleted (for example S3 Object Lock in compliance mode).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: calipa
      POSTGRES_USER: calipa
      POSTGRES_PASSWORD: calipa-dev-only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "calipa"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  migrate:
    build: ..
    env_file: ../.env
    environment: &db
      CALIPA_DATABASE_URL: postgresql://calipa:calipa-dev-only@db:5432/calipa
    command: ["python", "-m", "calipa.audit_trail.db", "migrate"]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ..
    env_file: ../.env
    environment:
      <<: *db
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: ..
    env_file: ../.env
    environment:
      <<: *db
      CALIPA_ANCHOR_DIR: /anchors
    command: ["python", "-m", "calipa.worker"]
    volumes: [anchors:/anchors]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  anchors:
