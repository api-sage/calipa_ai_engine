[project]
name = "calipa"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ahrufcodes", email = "ahrufdesign@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "llama-api-client>=0.6.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = ["S101"]  # asserts are used for invariants and in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls the real FCY API (read-only); run with CALIPA_LIVE=1"]
